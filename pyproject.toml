[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]
include = ["hackalem/**/*.py", "starter/**/*.py", "tests/**/*.py", "experiments/**/*.py"]
extend-exclude = [".venv", ".*-version-*", ".*-previous-*", "starter/out"]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Long human explanations and URLs can exceed the formatter's line length.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["hackalem/contracts.py", "hackalem/input_contracts.py"]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
# The initial typed boundary is deliberate; the remaining modules are not yet typed.
follow_imports = "skip"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "networkx", "networkx.*"]
# DataFrame column schemas are checked at runtime. Third-party stubs are a later step.
ignore_missing_imports = true
